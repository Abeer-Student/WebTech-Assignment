<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | E-Arena</title>
    <link rel="icon" type="image/png" href="../assets/img/icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #38bdf8;
        border-radius: 4px;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 font-sans antialiased text-slate-800 flex flex-col min-h-screen"
  >
    <!-- 1. Consistent Navbar Component -->
    <nav
      class="bg-slate-800 shadow-lg px-6 py-4 flex items-center justify-between sticky top-0 z-50 border-b border-slate-700"
    >
      <a href="../../index.html" class="flex items-center gap-3 group">
        <div
          class="relative flex items-center justify-center w-10 h-10 bg-gradient-to-br from-sky-400 to-sky-600 rounded-lg shadow-[0_0_15px_rgba(56,189,248,0.4)] group-hover:shadow-[0_0_20px_rgba(56,189,248,0.7)] transition-all duration-300 transform group-hover:-translate-y-0.5"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6 h-6 text-slate-900"
          >
            <path
              fill-rule="evenodd"
              d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <span
          class="text-2xl font-black text-white tracking-widest uppercase italic drop-shadow-md group-hover:text-sky-400 transition-colors duration-300"
          >E-Arena</span
        >
      </a>

      <div class="hidden md:flex gap-8">
        <a
          href="../../index.html"
          class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all"
          >Home</a
        >
        <a
          href="about.html"
          class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all"
          >About</a
        >
        <a
          href="contact.html"
          class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all"
          >Contact</a
        >
        <!-- Active Page Indicator on Sign In -->
        <a
          href="signin.html"
          class="text-white border-b-2 border-sky-400 pb-1 text-sm font-medium transition-all"
          >Sign In</a
        >
        <a
          href="signup.html"
          class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all"
          >Sign Up</a
        >
      </div>
    </nav>

    <!-- 2. Sign In Form Section -->
    <main
      class="flex-grow flex items-center justify-center px-4 py-16 bg-slate-900 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"
    >
      <div
        class="max-w-md w-full bg-white p-8 rounded-2xl shadow-2xl border border-slate-200"
      >
        <!-- Form Header -->
        <div class="text-center mb-8">
          <h2
            class="text-3xl font-extrabold text-slate-800 uppercase tracking-wide"
          >
            Welcome <span class="text-sky-500">Back</span>
          </h2>
          <p class="text-slate-500 text-sm mt-2">
            Sign in to access your dashboard and tournaments.
          </p>
        </div>

        <!-- 3. Form Component -->
        <form
          action="../../index.html"
          method="GET"
          class="flex flex-col gap-5"
        >
          <!-- Email Input -->
          <div class="flex flex-col gap-2">
            <label for="email" class="text-sm font-bold text-slate-700"
              >Email Address</label
            >
            <div class="relative">
              <input
                type="email"
                id="email"
                required
                placeholder="player@e-arena.com"
                class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm"
              />
              <!-- Input Icon -->
              <svg
                class="w-5 h-5 text-slate-400 absolute left-3 top-2.5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                ></path>
              </svg>
            </div>
          </div>

          <!-- Password Input -->
          <div class="flex flex-col gap-2">
            <label for="password" class="text-sm font-bold text-slate-700"
              >Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="password"
                required
                placeholder="••••••••"
                class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm"
              />
              <!-- Input Icon -->
              <svg
                class="w-5 h-5 text-slate-400 absolute left-3 top-2.5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                ></path>
              </svg>
            </div>
          </div>

          <!-- Options Row -->
          <div class="flex items-center justify-between mt-1">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                class="w-4 h-4 text-sky-500 rounded border-slate-300 focus:ring-sky-500"
              />
              <span class="text-sm text-slate-600 font-medium"
                >Remember me</span
              >
            </label>
            <!-- Updated Forgot Password Link -->
            <a
              href="#"
              onclick="
                alert(
                  'A password reset link has been sent to your email address!',
                );
                return false;
              "
              class="text-sm text-sky-500 font-bold hover:text-sky-600 transition-colors"
            >
              Forgot Password?
            </a>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="mt-4 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-lg transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
          >
            Sign In
          </button>
        </form>

        <!-- Social/Alternate Login -->
        <div class="mt-6 text-center">
          <p class="text-sm text-slate-500">
            Don't have an account?
            <a href="signup.html" class="text-sky-500 font-bold hover:underline"
              >Sign Up here</a
            >
          </p>
        </div>
      </div>
    </main>

    <!-- 4. Consistent Footer Component -->
    <footer
      class="bg-slate-900 text-slate-400 py-8 text-center mt-auto border-t border-slate-800"
    >
      <p class="text-sm">© 2026 E-Arena. All rights reserved.</p>
    </footer>
  </body>
</html>
