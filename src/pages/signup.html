<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | E-Arena</title>
    <link rel="icon" type="image/png" href="../assets/img/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 flex flex-col min-h-screen">

    <!-- 1. Consistent Navbar Component -->
    <nav class="bg-slate-800 shadow-lg px-6 py-4 flex items-center justify-between sticky top-0 z-50 border-b border-slate-700">
        <a href="../../index.html" class="flex items-center gap-3 group">
            <div class="relative flex items-center justify-center w-10 h-10 bg-gradient-to-br from-sky-400 to-sky-600 rounded-lg shadow-[0_0_15px_rgba(56,189,248,0.4)] group-hover:shadow-[0_0_20px_rgba(56,189,248,0.7)] transition-all duration-300 transform group-hover:-translate-y-0.5">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-slate-900">
                    <path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z" clip-rule="evenodd" />
                </svg>
            </div>
            <span class="text-2xl font-black text-white tracking-widest uppercase italic drop-shadow-md group-hover:text-sky-400 transition-colors duration-300">E-Arena</span>
        </a>
        
        <div class="hidden md:flex gap-8">
            <a href="../../index.html" class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all">Home</a>
            <a href="about.html" class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all">About</a>
            <a href="contact.html" class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all">Contact</a>
            <a href="signin.html" class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all">Sign In</a>
            <!-- Active Page Indicator on Sign Up -->
            <a href="signup.html" class="text-white border-b-2 border-sky-400 pb-1 text-sm font-medium transition-all">Sign Up</a>
        </div>

        <div class="hidden lg:flex items-center gap-3">
            <label for="search" class="text-slate-400 text-sm font-medium">Search</label>
            <div class="relative">
                <input type="text" id="search" placeholder="Games, Players..." class="pl-3 pr-8 py-1.5 bg-slate-900 border border-slate-700 text-white rounded-md text-sm outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500 absolute right-2.5 top-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>
    </nav>

    <!-- 2. Sign Up Form Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 bg-slate-900 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
        
        <div class="max-w-lg w-full bg-white p-8 rounded-2xl shadow-2xl border border-slate-200">
            <!-- Form Header -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-slate-800 uppercase tracking-wide">Join the <span class="text-sky-500">Arena</span></h2>
                <p class="text-slate-500 text-sm mt-2">Create your account to start competing in tournaments.</p>
            </div>

            <!-- 3. Form Component -->
            <form action="signin.html" method="GET" class="flex flex-col gap-5">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Full Name Input -->
                    <div class="flex flex-col gap-2">
                        <label for="name" class="text-sm font-bold text-slate-700">Full Name</label>
                        <input type="text" id="name" required placeholder="John Doe" 
                            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm">
                    </div>
                    
                    <!-- DOB Input -->
                    <div class="flex flex-col gap-2">
                        <label for="dob" class="text-sm font-bold text-slate-700">Date of Birth</label>
                        <input type="date" id="dob" required 
                            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm text-slate-600">
                    </div>
                </div>

                <!-- Email Input -->
                <div class="flex flex-col gap-2">
                    <label for="email" class="text-sm font-bold text-slate-700">Email Address</label>
                    <input type="email" id="email" required placeholder="player@e-arena.com" 
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm">
                </div>

                <!-- Password Input -->
                <div class="flex flex-col gap-2">
                    <label for="password" class="text-sm font-bold text-slate-700">Password</label>
                    <input type="password" id="password" required placeholder="Create a strong password" 
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm">
                </div>

                <!-- Terms and Conditions -->
                <div class="flex items-start gap-2 mt-2">
                    <input type="checkbox" id="terms" required class="w-4 h-4 mt-1 text-sky-500 rounded border-slate-300 focus:ring-sky-500 cursor-pointer">
                    <label for="terms" class="text-sm text-slate-600 font-medium cursor-pointer">
                        I agree to the <a href="#" class="text-sky-500 hover:underline">Terms of Service</a> and <a href="#" class="text-sky-500 hover:underline">Privacy Policy</a>.
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="mt-4 bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 rounded-lg transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                    Create Account
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-slate-500">Already have an account? 
                    <a href="signin.html" class="text-sky-500 font-bold hover:underline">Sign In here</a>
                </p>
            </div>
        </div>

    </main>

    <!-- 4. Consistent Footer Component -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center mt-auto border-t border-slate-800">
        <p class="text-sm">© 2026 E-Arena. All rights reserved.</p>
    </footer>

</body>
</html>
