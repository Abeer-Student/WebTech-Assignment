<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | E-Arena</title>
    <link rel="icon" type="image/png" href="../assets/img/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #38bdf8;
        border-radius: 4px;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 font-sans antialiased text-slate-800 flex flex-col min-h-screen"
  >
    <!-- 1. Consistent Navbar Component -->
    <nav
      class="bg-slate-800 shadow-lg px-6 py-4 flex items-center justify-between sticky top-0 z-50 border-b border-slate-700"
    >
      <a href="../../index.html" class="flex items-center gap-3 group">
        <div
          class="relative flex items-center justify-center w-10 h-10 bg-gradient-to-br from-sky-400 to-sky-600 rounded-lg shadow-[0_0_15px_rgba(56,189,248,0.4)] group-hover:shadow-[0_0_20px_rgba(56,189,248,0.7)] transition-all duration-300 transform group-hover:-translate-y-0.5"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6 h-6 text-slate-900"
          >
            <path
              fill-rule="evenodd"
              d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <span
          class="text-2xl font-black text-white tracking-widest uppercase italic drop-shadow-md group-hover:text-sky-400 transition-colors duration-300"
          >E-Arena</span
        >
      </a>

      <div class="hidden md:flex gap-8">
        <a
          href="../../index.html"
          class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all"
          >Home</a
        >
        <a
          href="about.html"
          class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all"
          >About</a
        >
        <!-- Active Page Indicator on Contact -->
        <a
          href="contact.html"
          class="text-white border-b-2 border-sky-400 pb-1 text-sm font-medium transition-all"
          >Contact</a
        >
        <a
          href="signin.html"
          class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all"
          >Sign In</a
        >
        <a
          href="signup.html"
          class="text-slate-300 hover:text-white border-b-2 border-transparent hover:border-sky-400 pb-1 text-sm font-medium transition-all"
          >Sign Up</a
        >
      </div>

    </nav>

    <!-- 2. Page Header Component -->
    <header
      class="bg-slate-900 text-center py-16 px-4 border-b-4 border-sky-500"
    >
      <h1
        class="text-4xl font-extrabold text-white uppercase tracking-wider mb-4"
      >
        Get in <span class="text-sky-400">Touch</span>
      </h1>
      <p class="text-slate-400 max-w-xl mx-auto text-lg">
        Have a question about a tournament or need support? Drop us a message
        below.
      </p>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12">
      <div class="flex flex-col lg:flex-row gap-12 max-w-6xl mx-auto">
        <!-- 3. Contact Info Cards (Left Column) -->
        <div class="lg:w-1/3 flex flex-col gap-6">
          <!-- Info Card 1 -->
          <div
            class="bg-white p-6 rounded-xl shadow-md border border-slate-200 flex items-start gap-4"
          >
            <div class="p-3 bg-sky-100 text-sky-500 rounded-lg">
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                ></path>
              </svg>
            </div>
            <div>
              <h4 class="text-lg font-bold text-slate-800">Email Us</h4>
              <p class="text-slate-500 text-sm mt-1">support@e-arena.com</p>
            </div>
          </div>

          <!-- Info Card 2 -->
          <div
            class="bg-white p-6 rounded-xl shadow-md border border-slate-200 flex items-start gap-4"
          >
            <div class="p-3 bg-sky-100 text-sky-500 rounded-lg">
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                ></path>
              </svg>
            </div>
            <div>
              <h4 class="text-lg font-bold text-slate-800">Call Us</h4>
              <p class="text-slate-500 text-sm mt-1">+92 111 222 333</p>
            </div>
          </div>

          <!-- Info Card 3 -->
          <div
            class="bg-white p-6 rounded-xl shadow-md border border-slate-200 flex items-start gap-4"
          >
            <div class="p-3 bg-sky-100 text-sky-500 rounded-lg">
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
              </svg>
            </div>
            <div>
              <h4 class="text-lg font-bold text-slate-800">Location</h4>
              <p class="text-slate-500 text-sm mt-1">
                Model Town Lahore, Pakistan
              </p>
            </div>
          </div>
        </div>
        <div
          class="lg:w-2/3 bg-white p-8 rounded-xl shadow-lg border border-slate-200"
        >
          <h3 class="text-2xl font-bold text-slate-800 mb-6">Send a Message</h3>

          <form
            action="https://formspree.io/f/mvkgyned"
            method="POST"
            class="flex flex-col gap-5"
          >
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div class="flex flex-col gap-2">
                <label for="name" class="text-sm font-semibold text-slate-600"
                  >Full Name</label
                >
                <input
                  type="text"
                  id="name"
                  name="name"
                  required
                  placeholder="Ahmad Akbar"
                  class="px-4 py-2 border border-slate-300 rounded-md outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm"
                />
              </div>

              <div class="flex flex-col gap-2">
                <label for="email" class="text-sm font-semibold text-slate-600"
                  >Email Address</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  placeholder="ahmad@example.com"
                  class="px-4 py-2 border border-slate-300 rounded-md outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm"
                />
              </div>
            </div>

            <div class="flex flex-col gap-2">
              <label for="subject" class="text-sm font-semibold text-slate-600"
                >Subject</label
              >
              <input
                type="text"
                id="subject"
                name="subject"
                required
                placeholder="Tournament Inquiry"
                class="px-4 py-2 border border-slate-300 rounded-md outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm"
              />
            </div>

            <div class="flex flex-col gap-2">
              <label for="message" class="text-sm font-semibold text-slate-600"
                >Message</label
              >
              <textarea
                id="message"
                name="message"
                rows="5"
                required
                placeholder="How can we help you?"
                class="px-4 py-2 border border-slate-300 rounded-md outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition-all text-sm resize-none"
              ></textarea>
            </div>

            <button
              type="submit"
              class="mt-2 bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 rounded-md transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
            >
              Send Message
            </button>
          </form>
        </div>
      </div>
    </main>

    <!-- 5. Consistent Footer -->
    <footer
      class="bg-slate-900 text-slate-400 py-8 text-center mt-auto border-t border-slate-800"
    >
      <p class="text-sm">© 2026 E-Arena. All rights reserved.</p>
    </footer>
  </body>
</html>
